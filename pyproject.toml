[project]
name = "rag-nimbus"
version = "0.3.0"
description = "Sistema de recuperación semántica local (RAG) con ChromaDB, LangChain (LCEL) y Pydantic."
requires-python = ">=3.10"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:chromadb.*"]
